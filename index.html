<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ketan Arora — Desktop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop">

  <video class="scene-video" autoplay muted loop playsinline>
    <source src="bg-video.mp4" type="video/mp4">
  </video>

  <div class="vignette"></div>

  <div id="hero">
    <div class="greet">Hey, I'm Ketan Arora! Welcome to my</div>
    <div class="title">portfolio</div>
    <div class="alias">alias: Seeker</div>
  </div>

  <div id="topbar">
    <div class="tb-left"><span class="dot"></span>Ketan Arora</div>
    <nav>
      <button data-app="about">About</button>
      <button data-app="skills">Skills</button>
      <button data-app="projects">Projects</button>
      <button data-app="resume">Resume</button>
      <button data-app="contact">Contact</button>
      <button id="theme-btn" style="display:flex;align-items:center;gap:6px;">
        <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14" style="display:none;"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
        <span>Theme</span>
      </button>
    </nav>
    <div class="tb-status">
      <span id="topbar-time">--:--</span>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="folder-icon" viewBox="0 0 64 64">
        <defs>
          <linearGradient id="folderBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7ec8ff"/>
            <stop offset="100%" stop-color="#2f8fe0"/>
          </linearGradient>
          <linearGradient id="folderTab" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a9dcff"/>
            <stop offset="100%" stop-color="#6ab8f5"/>
          </linearGradient>
        </defs>
        <path d="M4 16c0-2.2 1.8-4 4-4h14l5 6h29c2.2 0 4 1.8 4 4v30c0 2.2-1.8 4-4 4H8c-2.2 0-4-1.8-4-4V16z" fill="url(#folderBody)"/>
        <path d="M4 16c0-2.2 1.8-4 4-4h14l5 6h29c2.2 0 4 1.8 4 4v30c0 2.2-1.8 4-4 4H8c-2.2 0-4-1.8-4-4V16z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
        <path d="M4 22h56v2H4z" fill="#ffffff" opacity="0.18"/>
        <path d="M4 16c0-2.2 1.8-4 4-4h14l5 6H4v-2z" fill="url(#folderTab)"/>
      </symbol>

      <symbol id="icon-explorer" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="expBack" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5fb8ff"/><stop offset="100%" stop-color="#1e6fd9"/>
          </linearGradient>
          <linearGradient id="expFront" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe28a"/><stop offset="100%" stop-color="#ffb100"/>
          </linearGradient>
        </defs>
        <path d="M5 12c0-2 1.6-3.6 3.6-3.6H20l3.6 4.4h15.8C41.4 12.8 43 14.4 43 16.4V19H5z" fill="url(#expBack)"/>
        <rect x="5" y="17" width="38" height="21" rx="3" fill="url(#expBack)"/>
        <path d="M9 22c0-1.7 1.3-3 3-3h11l3 3.6h14c1.7 0 3 1.3 3 3V35c0 1.7-1.3 3-3 3H12c-1.7 0-3-1.3-3-3z" fill="url(#expFront)"/>
      </symbol>

      <symbol id="icon-browser" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="browA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4fd1ff"/><stop offset="100%" stop-color="#1a7fe0"/>
          </linearGradient>
          <linearGradient id="browB" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#8affc1"/><stop offset="100%" stop-color="#12c98a"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="19" fill="url(#browA)"/>
        <path d="M24 5a19 19 0 0 1 16.5 28.5A14 14 0 0 0 18 12.5 19 19 0 0 1 24 5Z" fill="url(#browB)" opacity="0.9"/>
        <circle cx="24" cy="24" r="8" fill="#eaf7ff"/>
        <circle cx="24" cy="24" r="4.2" fill="#1a7fe0"/>
      </symbol>

      <symbol id="icon-photos" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="photoBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6ec8ff"/><stop offset="100%" stop-color="#3a6ff0"/>
          </linearGradient>
        </defs>
        <rect x="4" y="6" width="40" height="36" rx="7" fill="url(#photoBg)"/>
        <circle cx="16" cy="18" r="5" fill="#ffe28a"/>
        <path d="M4 36l11-13 8 9 6-7 15 17.5a7 7 0 0 1-6 3.5H11a7 7 0 0 1-7-7z" fill="#e8f4ff"/>
      </symbol>

      <symbol id="icon-people" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="ppl" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c9a4ff"/><stop offset="100%" stop-color="#8a4fe0"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="20" fill="url(#ppl)"/>
        <circle cx="24" cy="19" r="7" fill="#f4ecff"/>
        <path d="M10 39c1.6-8 7-12.5 14-12.5S36.4 31 38 39a20 20 0 0 1-28 0Z" fill="#f4ecff"/>
      </symbol>

      <symbol id="icon-skills" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="skillTop" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#a0f0c8"/><stop offset="100%" stop-color="#2fd189"/>
          </linearGradient>
          <linearGradient id="skillMid" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7ec8ff"/><stop offset="100%" stop-color="#2f8fe0"/>
          </linearGradient>
          <linearGradient id="skillBot" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c9a4ff"/><stop offset="100%" stop-color="#8a4fe0"/>
          </linearGradient>
        </defs>
        <polygon points="24,4 44,14 24,24 4,14" fill="url(#skillTop)"/>
        <polygon points="4,22 24,32 44,22 44,14 24,24 4,14" fill="url(#skillMid)"/>
        <polygon points="4,30 24,40 44,30 44,22 24,32 4,22" fill="url(#skillBot)"/>
      </symbol>

      <symbol id="icon-bin" viewBox="0 0 48 48">
        <defs>
          <linearGradient id="binG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c9d2db"/><stop offset="100%" stop-color="#8b98a6"/>
          </linearGradient>
        </defs>
        <rect x="10" y="9" width="28" height="5" rx="2" fill="#a7b1bc"/>
        <rect x="18" y="4" width="12" height="5" rx="2" fill="#a7b1bc"/>
        <path d="M12 15h24l-2.4 26a3 3 0 0 1-3 2.8H17.4a3 3 0 0 1-3-2.8Z" fill="url(#binG)"/>
        <line x1="19" y1="20" x2="20" y2="38" stroke="#5c6874" stroke-width="2" stroke-linecap="round"/>
        <line x1="24" y1="20" x2="24" y2="38" stroke="#5c6874" stroke-width="2" stroke-linecap="round"/>
        <line x1="29" y1="20" x2="28" y2="38" stroke="#5c6874" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div id="icons">
    <div class="icon" data-app="about" tabindex="0"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>About Me</span></div>
    <div class="icon" data-app="skills" tabindex="0"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Skills</span></div>
    <div class="icon" data-app="projects" tabindex="0"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Projects</span></div>
    <div class="icon" data-app="resume" tabindex="0"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Resume</span></div>
    <div class="icon" data-app="contact" tabindex="0"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Contact</span></div>
    <div class="icon" data-app="inspiration" tabindex="0"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Inspiration</span></div>
  </div>

  <div id="windows-container"></div>

  <div id="start-menu" class="hidden">
    <div class="sm-label">Pinned</div>
    <div class="sm-grid">
      <div class="sm-tile" data-app="about"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>About</span></div>
      <div class="sm-tile" data-app="skills"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Skills</span></div>
      <div class="sm-tile" data-app="projects"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Projects</span></div>
      <div class="sm-tile" data-app="resume"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Resume</span></div>
      <div class="sm-tile" data-app="contact"><svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg><span>Contact</span></div>
    </div>
    <div class="sm-footer">
      <div class="sm-avatar">K</div>
      <div>Ketan Arora<br><span style="font-size:11px">Full Stack Developer · aka Seeker</span></div>
    </div>
  </div>

  <div id="taskbar-wrap">
    <div id="taskbar">
      <button id="start-btn" class="tb-btn" aria-label="Start">
        <svg viewBox="0 0 24 24" fill="#5ad1ff"><rect x="2" y="2" width="9" height="9" rx="1"/><rect x="13" y="2" width="9" height="9" rx="1"/><rect x="2" y="13" width="9" height="9" rx="1"/><rect x="13" y="13" width="9" height="9" rx="1"/></svg>
      </button>
      <div class="tb-search" id="tb-search-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search</span>
      </div>
      <div class="tb-sep"></div>
      <div id="tb-pinned">
        <button class="tb-btn" data-app="about" title="File Explorer — About">
          <svg viewBox="0 0 48 48"><use href="#icon-explorer"/></svg>
        </button>
        <button class="tb-btn" data-app="projects" title="Projects">
          <svg viewBox="0 0 64 64"><use href="#folder-icon"/></svg>
        </button>
        <button class="tb-btn" data-app="gallery" title="Gallery">
          <svg viewBox="0 0 48 48"><use href="#icon-photos"/></svg>
        </button>
        <button class="tb-btn" data-app="contact" title="Mail — Contact">
          <svg viewBox="0 0 48 48"><use href="#icon-people"/></svg>
        </button>
        <button class="tb-btn" data-app="skills" title="Skills">
          <svg viewBox="0 0 48 48"><use href="#icon-skills"/></svg>
        </button>
      </div>
      <div class="tb-sep"></div>
      <div id="tb-running"></div>
      <div class="tb-sep"></div>
      <div id="tb-tray">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 8.5a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </div>
      <div id="tb-clock">
        <div id="tb-time">--:--</div>
        <div class="date" id="tb-date">--</div>
      </div>
    </div>
  </div>
  <div id="lightbox">
    <button id="lightbox-close" aria-label="Close">✕</button>
    <img id="lightbox-img" src="" alt="">
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
